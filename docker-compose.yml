services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: abeokuta-tourism-api:local
    container_name: abeokuta-api
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      DATA_DIR: /data
      DATABASE_URL: sqlite:////data/abeokuta.db
      SECRET_KEY: dev-only-secret-do-not-use-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
      SEED_ON_STARTUP: "true"
      SQL_ECHO: "false"
      DOCS_ENABLED: "true"
    volumes:
      # Named volume keeps the SQLite file across `docker compose down`.
      - abeokuta-data:/data
      # Live reload during development: comment out for a production-like run.
      - ./app:/srv/app:ro
    command: >
      sh -c "exec uvicorn app.main:app --host 0.0.0.0 --port 8000
             --workers 1 --reload --reload-dir /srv/app"
    restart: unless-stopped

volumes:
  abeokuta-data:
